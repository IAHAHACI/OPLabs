ів у файл</text><rect x="91.6" y="614.0" width="338.7" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="261.0" y="641.5" text-anchor="middle" fill="#111">Обчислити ознаку успіху: записано всіх n студентів</text><polygon points="261.0,704.0 369.0,747.2 261.0,790.4 152.9,747.2" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="261.0" y="751.7" text-anchor="middle" fill="#111">Не вдалося закрити файл?</text><rect x="140.7" y="838.4" width="240.6" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="261.0" y="865.9" text-anchor="middle" fill="#111">Замінити ознаку успіху на хибність</text><polygon points="261.0,1016.4 340.8,1054.4 261.0,1092.4 181.1,1054.4" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="261.0" y="1058.9" text-anchor="middle" fill="#111">Запис невдалий?</text><polygon points="103.7,1140.4 436.7,1140.4 418.3,1186.4 85.3,1186.4" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="261.0" y="1167.9" text-anchor="middle" fill="#111">Вивести повідомлення про помилку запису файлу</text><rect x="171.6" y="1274.4" width="178.7" height="46.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="261.0" y="1301.9" text-anchor="middle" fill="#111">Повернути ознаку успіху</text><rect x="196.0" y="1364.4" width="130.0" height="42.0" rx="21.0" fill="#fdfdfd" stroke="#222" stroke-width="1.5"/><text x="261.0" y="1389.9" text-anchor="middle" fill="#111">Кінець</text></svg>