<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1580" viewBox="0 0 1050 1580" role="img" aria-labelledby="title"><title id="title">findCourseWithMostDeletedStudents()</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs><style>text{font:20px 'Times New Roman',serif;fill:#111}.label{font-size:18px}.node{fill:white;stroke:#111;stroke-width:1.6}.line,.arrow{fill:none;stroke:#111;stroke-width:1.6}.arrow{marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="525" y="40" text-anchor="middle" style="font-size:23px;font-weight:bold">findCourseWithMostDeletedStudents()</text><path d="M440,152 V206" class="arrow"/><path d="M440,268 V322" class="arrow"/><path d="M710,387 V387 H873 V1318 H440 V1338" class="arrow"/><text x="728" y="374" class="label">Ні</text><path d="M440,452 V506" class="arrow"/><text x="455" y="485" class="label">Так</text><path d="M710,571 V571 H902 V902 H440 V922" class="arrow"/><text x="728" y="558" class="label">Ні</text><path d="M440,636 V690" class="arrow"/><text x="455" y="669" class="label">Так</text><path d="M440,752 V806" class="arrow"/><path d="M440,868 V891 H77 V486 H440 V506" class="arrow"/><path d="M440,984 V1038" class="arrow"/><path d="M710,1103 V1103 H844 V1434 H440 V1454" class="arrow"/><text x="728" y="1090" class="label">Ні</text><path d="M440,1168 V1222" class="arrow"/><text x="455" y="1201" class="label">Так</text><path d="M440,1284 V1307 H873 V1434 H440 V1454" class="arrow"/><path d="M440,1400 V1454" class="arrow"/><rect x="170" y="90" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="128">Початок</tspan></text><rect x="170" y="206" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="244">Відкрити deleted.bin у режимі rb; counts[4] = 0</tspan></text><polygon points="440,322 710,387 440,452 170,387" class="node"/><text text-anchor="middle"><tspan x="440" y="394">Файл відкрито?</tspan></text><polygon points="440,506 710,571 440,636 170,571" class="node"/><text text-anchor="middle"><tspan x="440" y="578">fread прочитала структуру?</tspan></text><rect x="170" y="690" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="728">Якщо курс 1–4, збільшити counts[course−1]</tspan></text><rect x="170" y="806" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="844">Наступний запис</tspan></text><rect x="170" y="922" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="960">Закрити deleted.bin</tspan></text><polygon points="440,1038 710,1103 440,1168 170,1103" class="node"/><text text-anchor="middle"><tspan x="440" y="1097.5">writeCounts(courses.bin,</tspan><tspan x="440" y="1122.5">counts, 4) успішний?</tspan></text><rect x="170" y="1222" width="540" height="62" rx="0" class="node"/><path d="M185,1222 V1284 M695,1222 V1284" class="line"/><text text-anchor="middle"><tspan x="440" y="1260">outputCounts(courses.bin, courses, 4)</tspan></text><polygon points="194,1338 710,1338 686,1400 170,1400" class="node"/><text text-anchor="middle"><tspan x="440" y="1376">Повідомити: спочатку створіть файл студентів</tspan></text><rect x="170" y="1454" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="1492">Кінець</tspan></text></svg>