<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="1412" viewBox="0 0 1050 1412" role="img" aria-labelledby="title"><title id="title">findShortestWord(line, shortestWord)</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs><style>text{font:20px 'Times New Roman',serif;fill:#111}.label{font-size:18px}.node{fill:white;stroke:#111;stroke-width:1.6}.line,.arrow{fill:none;stroke:#111;stroke-width:1.6}.arrow{marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="525" y="40" text-anchor="middle" style="font-size:23px;font-weight:bold">findShortestWord(line, shortestWord)</text><path d="M440,152 V206" class="arrow"/><path d="M440,268 V322" class="arrow"/><path d="M710,387 V387 H873 V1266 H440 V1286" class="arrow"/><text x="728" y="374" class="label">Ні</text><path d="M440,452 V506" class="arrow"/><text x="455" y="485" class="label">Так</text><path d="M440,568 V622" class="arrow"/><path d="M440,684 V738" class="arrow"/><path d="M710,803 V803 H960 V1034 H440 V1054" class="arrow"/><text x="728" y="790" class="label">Ні</text><path d="M440,868 V922" class="arrow"/><text x="455" y="901" class="label">Так</text><path d="M440,1000 V1054" class="arrow"/><path d="M440,1116 V1170" class="arrow"/><path d="M440,1232 V1255 H55 V302 H440 V322" class="arrow"/><rect x="170" y="90" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="128">Початок</tspan></text><rect x="170" y="206" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="244">i = 0; minLength = 256; shortestWord — порожній</tspan></text><polygon points="440,322 710,387 440,452 170,387" class="node"/><text text-anchor="middle"><tspan x="440" y="394">line[i] не нульовий символ?</tspan></text><rect x="170" y="506" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="544">Пропустити роздільники за допомогою strspn</tspan></text><rect x="170" y="622" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="660">wordLength = strcspn(line + i, роздільники)</tspan></text><polygon points="440,738 710,803 440,868 170,803" class="node"/><text text-anchor="middle"><tspan x="440" y="810">0 &lt; wordLength &lt; minLength?</tspan></text><rect x="170" y="922" width="540" height="78" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="955.5">Оновити minLength; скопіювати слово й додати</tspan><tspan x="440" y="980.5">нульовий символ</tspan></text><rect x="170" y="1054" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1092">i = i + wordLength</tspan></text><rect x="170" y="1170" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1208">Перевірити наступне слово</tspan></text><rect x="170" y="1286" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="1324">Повернути найкоротше слово через параметр</tspan></text></svg>