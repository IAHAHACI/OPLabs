span></text><polygon points="440,554 710,619 440,684 170,619" class="node"/><text text-anchor="middle"><tspan x="440" y="626">i &lt; studentCount і немає EOF?</tspan></text><rect x="170" y="738" width="540" height="62" rx="0" class="node"/><path d="M185,738 V800 M695,738 V800" class="line"/><text text-anchor="middle"><tspan x="440" y="776">inputStudent(students[i]); i++</tspan></text><rect x="170" y="854" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="892">Наступний студент</tspan></text><polygon points="440,970 710,1035 440,1100 170,1035" class="node"/><text text-anchor="middle"><tspan x="440" y="1029.5">Немає EOF і запис students.bin</tspan><tspan x="440" y="1054.5">успішний?</tspan></text><rect x="170" y="1154" width="540" height="62" rx="0" class="node"/><path d="M185,1154 V1216 M695,1154 V1216" class="line"/><text text-anchor="middle"><tspan x="440" y="1192">Очистити deleted.bin: writeStudents(..., 0, wb)</tspan></text><rect x="170" y="1270" width="540" height="62" rx="0" class="node"/><path d="M185,1270 V1332 M695,1270 V1332" class="line"/><text text-anchor="middle"><tspan x="440" y="1308">studentsDataTableOutput(students, studentCount)</tspan></text><rect x="170" y="1386" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="1424">Кінець</tspan></text></svg>