" fill="#000000">Збільшити i на 1</ns0:text></ns0:g><ns0:g data-line="85"><ns0:polygon points="200.2,1150.0 303.6,1188.0 200.2,1226.0 96.8,1188.0" fill="#ffffff" stroke="#000000" stroke-width="1.5" /><ns0:text x="200.2" y="1192.5" text-anchor="middle" fill="#000000">Різниця між словами = 1</ns0:text></ns0:g><ns0:g data-line="87"><ns0:rect x="262.6" y="1274.0" width="130.0" height="46.0" fill="#ffffff" stroke="#000000" stroke-width="1.5" /><ns0:text x="327.6" y="1301.5" text-anchor="middle" fill="#000000">Повернути true</ns0:text></ns0:g><ns0:g data-line="90"><ns0:rect x="135.2" y="1408.0" width="130.0" height="46.0" fill="#ffffff" stroke="#000000" stroke-width="1.5" /><ns0:text x="200.2" y="1435.5" text-anchor="middle" fill="#000000">Повернути false</ns0:text></ns0:g><ns0:rect x="135.2" y="1542.0" width="130.0" height="42.0" rx="21.0" fill="#ffffff" stroke="#000000" stroke-width="1.5" /><ns0:text x="200.2" y="1567.5" text-anchor="middle" fill="#000000">Кінець</ns0:text></ns0:svg>