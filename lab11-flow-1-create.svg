<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="2076" viewBox="0 0 1050 2076" role="img" aria-labelledby="title"><title id="title">createTextFile()</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs><style>text{font:20px 'Times New Roman',serif;fill:#111}.label{font-size:18px}.node{fill:white;stroke:#111;stroke-width:1.6}.line,.arrow{fill:none;stroke:#111;stroke-width:1.6}.arrow{marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="525" y="40" text-anchor="middle" style="font-size:23px;font-weight:bold">createTextFile()</text><path d="M440,152 V206" class="arrow"/><path d="M440,268 V322" class="arrow"/><path d="M710,387 V387 H873 V1814 H440 V1834" class="arrow"/><text x="728" y="374" class="label">Ні</text><path d="M440,452 V506" class="arrow"/><text x="455" y="485" class="label">Так</text><path d="M440,584 V638" class="arrow"/><path d="M440,700 V754" class="arrow"/><path d="M710,819 V819 H960 V1698 H440 V1718" class="arrow"/><text x="728" y="806" class="label">Ні</text><path d="M440,884 V938" class="arrow"/><text x="455" y="917" class="label">Так</text><path d="M440,1000 V1054" class="arrow"/><path d="M710,1119 V1119 H844 V1466 H440 V1486" class="arrow"/><text x="728" y="1106" class="label">Ні</text><path d="M440,1184 V1238" class="arrow"/><text x="455" y="1217" class="label">Так</text><path d="M440,1316 V1370" class="arrow"/><path d="M440,1432 V1455 H77 V918 H440 V938" class="arrow"/><path d="M440,1548 V1602" class="arrow"/><path d="M440,1664 V1687 H121 V734 H440 V754" class="arrow"/><path d="M440,1780 V1803 H815 V1930 H440 V1950" class="arrow"/><path d="M440,1896 V1950" class="arrow"/><rect x="170" y="90" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="128">Початок</tspan></text><rect x="170" y="206" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="244">Відкрити text.txt у режимі w</tspan></text><polygon points="440,322 710,387 440,452 170,387" class="node"/><text text-anchor="middle"><tspan x="440" y="394">Файл відкрито?</tspan></text><polygon points="194,506 710,506 686,584 170,584" class="node"/><text text-anchor="middle"><tspan x="440" y="539.5">Ввести lineCount (0–100); пропустити кінець</tspan><tspan x="440" y="564.5">рядка</tspan></text><rect x="170" y="638" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="676">i = 0</tspan></text><polygon points="440,754 710,819 440,884 170,819" class="node"/><text text-anchor="middle"><tspan x="440" y="826">i &lt; lineCount і немає EOF?</tspan></text><polygon points="194,938 710,938 686,1000 170,1000" class="node"/><text text-anchor="middle"><tspan x="440" y="976">Ввести line через cin.getline</tspan></text><polygon points="440,1054 710,1119 440,1184 170,1119" class="node"/><text text-anchor="middle"><tspan x="440" y="1126">Рядок задовгий і немає EOF?</tspan></text><polygon points="194,1238 710,1238 686,1316 170,1316" class="node"/><text text-anchor="middle"><tspan x="440" y="1271.5">Очистити cin, пропустити залишок і вивести</tspan><tspan x="440" y="1296.5">повідомлення</tspan></text><rect x="170" y="1370" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1408">Повторити введення рядка</tspan></text><rect x="170" y="1486" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1524">Якщо немає EOF, записати line та перенос; i++</tspan></text><rect x="170" y="1602" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1640">Наступний рядок</tspan></text><rect x="170" y="1718" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1756">Закрити файл; повідомити про помилку закриття</tspan></text><polygon points="194,1834 710,1834 686,1896 170,1896" class="node"/><text text-anchor="middle"><tspan x="440" y="1872">Повідомити про помилку відкриття</tspan></text><rect x="170" y="1950" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="1988">Кінець</tspan></text></svg>