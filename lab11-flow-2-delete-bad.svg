<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="2028" viewBox="0 0 1050 2028" role="img" aria-labelledby="title"><title id="title">deleteBadGradeStudents()</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z"/></marker></defs><style>text{font:20px 'Times New Roman',serif;fill:#111}.label{font-size:18px}.node{fill:white;stroke:#111;stroke-width:1.6}.line,.arrow{fill:none;stroke:#111;stroke-width:1.6}.arrow{marker-end:url(#arrow)}</style><rect width="100%" height="100%" fill="white"/><text x="525" y="40" text-anchor="middle" style="font-size:23px;font-weight:bold">deleteBadGradeStudents()</text><path d="M440,152 V206" class="arrow"/><path d="M440,268 V322" class="arrow"/><path d="M440,384 V438" class="arrow"/><path d="M710,503 V503 H902 V1882 H440 V1902" class="arrow"/><text x="728" y="490" class="label">Ні</text><path d="M440,568 V622" class="arrow"/><text x="455" y="601" class="label">Так</text><path d="M710,687 V687 H931 V1582 H440 V1602" class="arrow"/><text x="728" y="674" class="label">Ні</text><path d="M440,752 V806" class="arrow"/><text x="455" y="785" class="label">Так</text><path d="M440,868 V922" class="arrow"/><path d="M710,987 V987 H815 V1334 H440 V1354" class="arrow"/><text x="728" y="974" class="label">Ні</text><path d="M440,1052 V1106" class="arrow"/><text x="455" y="1085" class="label">Так</text><path d="M440,1184 V1238" class="arrow"/><path d="M440,1300 V1323 H55 V602 H440 V622" class="arrow"/><path d="M440,1432 V1486" class="arrow"/><path d="M440,1548 V1571 H99 V602 H440 V622" class="arrow"/><path d="M710,1667 V1667 H960 V1882 H440 V1902" class="arrow"/><text x="728" y="1654" class="label">Ні</text><path d="M440,1732 V1786" class="arrow"/><text x="455" y="1765" class="label">Так</text><path d="M440,1848 V1902" class="arrow"/><rect x="170" y="90" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="128">Початок</tspan></text><rect x="170" y="206" width="540" height="62" rx="0" class="node"/><path d="M185,206 V268 M695,206 V268" class="line"/><text text-anchor="middle"><tspan x="440" y="244">studentCount = readStudents(students)</tspan></text><rect x="170" y="322" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="360">deletedCount = 0; remainingCount = 0; i = 0</tspan></text><polygon points="440,438 710,503 440,568 170,503" class="node"/><text text-anchor="middle"><tspan x="440" y="497.5">Файл прочитано (studentCount ≥</tspan><tspan x="440" y="522.5">0)?</tspan></text><polygon points="440,622 710,687 440,752 170,687" class="node"/><text text-anchor="middle"><tspan x="440" y="694">i &lt; studentCount?</tspan></text><rect x="170" y="806" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="844">Підрахувати двійки серед шести оцінок</tspan></text><polygon points="440,922 710,987 440,1052 170,987" class="node"/><text text-anchor="middle"><tspan x="440" y="994">Факультет ФІТ і двійок ≥ 2?</tspan></text><rect x="170" y="1106" width="540" height="78" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1139.5">Додати студента до deletedStudents;</tspan><tspan x="440" y="1164.5">deletedCount++</tspan></text><rect x="170" y="1238" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1276">i++</tspan></text><rect x="170" y="1354" width="540" height="78" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1387.5">Зберегти студента у students[remainingCount];</tspan><tspan x="440" y="1412.5">remainingCount++</tspan></text><rect x="170" y="1486" width="540" height="62" rx="0" class="node"/><text text-anchor="middle"><tspan x="440" y="1524">i++</tspan></text><polygon points="440,1602 710,1667 440,1732 170,1667" class="node"/><text text-anchor="middle"><tspan x="440" y="1661.5">Допис deleted.bin і перезапис</tspan><tspan x="440" y="1686.5">students.bin успішні?</tspan></text><rect x="170" y="1786" width="540" height="62" rx="0" class="node"/><path d="M185,1786 V1848 M695,1786 V1848" class="line"/><text text-anchor="middle"><tspan x="440" y="1824">Вивести таблицю відрахованих у цьому запиті</tspan></text><rect x="170" y="1902" width="540" height="62" rx="30" class="node"/><text text-anchor="middle"><tspan x="440" y="1940">Кінець</tspan></text></svg>